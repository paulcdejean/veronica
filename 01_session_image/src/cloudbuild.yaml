# Run by the tofu layer's terraform_data provisioner (see ../tofu/build.tf):
# gcloud builds submit with _IMAGE pointing into Artifact Registry. Logging
# goes to Cloud Logging because the custom build service account has no
# default logs bucket.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--tag", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
